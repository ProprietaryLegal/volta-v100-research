<text x="20" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="start">Half the round is experts and dense multiplies at one row: per-layer overhead, not arithmetic. 14 % is outside any kernel.</text>
<text x="20" y="236" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Reading one 4,092-row prompt chunk, first stage: 793 ms</text>
