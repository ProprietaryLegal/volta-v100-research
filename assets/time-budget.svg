<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" width="800" height="366" role="img" aria-labelledby="t d">
<title id="t">Where the time of a decode round and of a prompt chunk goes</title>
<desc id="d">Twelve-card build, measured once at 200 W. A decode round of 26.25 ms: experts 29 percent, dense multiplies 21, drafter 10, attention 9, norms 7, router 5, index 3, four-card sums 2, head and sampling 2, outside any kernel 14. A 4,092-row prompt chunk on the first stage, 793 ms: experts, router and sums 318 ms, attention 119, output projection 104, norms 92, query and key projections 65, index 53, compressor and Engram 28, other 14.</desc>
<rect width="800" height="366" fill="#ffffff"/>
<text x="20" y="30" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1b1f24" text-anchor="start">Where the time goes (twelve-card build, measured once at 200 W)</text>
<text x="20" y="62" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">One decode round, one request, short chat: 26.25 ms</text>
