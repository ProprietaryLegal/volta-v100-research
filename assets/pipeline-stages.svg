<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" width="800" height="466" role="img" aria-labelledby="t d">
<title id="t">Pipeline stages of tensor-parallel cards</title>
<desc id="d">The model's 40 layers are cut into pipeline stages. Each stage runs on one four-card NVLink board in tensor parallel 4. Eight cards: layers 0 to 19 and 20 to 39. Twelve cards: layers 0 to 13, 14 to 27 and 28 to 39. Only the hand-off between stages crosses PCIe.</desc>
<rect width="800" height="466" fill="#ffffff"/>
<text x="20" y="30" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1b1f24" text-anchor="start">How the model is cut: pipeline stages of tensor-parallel cards</text>
<text x="20" y="60" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Eight cards, two stages (Volta sPLIt, Volta Max uPLIft, Volta Full NVFP4)</text>
