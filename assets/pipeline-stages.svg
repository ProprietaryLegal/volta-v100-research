<text x="312" y="208" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">+ head, drafter</text>
<line x1="220" y1="147" x2="300" y2="147" stroke="#cf222e" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="260" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#cf222e" text-anchor="middle">PCIe</text>
<text x="260" y="165" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#cf222e" text-anchor="middle">one hand-off</text>
<text x="260" y="178" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" fill="#cf222e" text-anchor="middle">per step</text>
<text x="530" y="100" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">Tensor parallel (TP4): each card holds a</text>
<text x="530" y="117" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">quarter of every matrix; the four add their</text>
<text x="530" y="134" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">partial results after every layer. That sum</text>
<text x="530" y="151" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">needs NVLink: 5.28 microseconds inside a</text>
<text x="530" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">board, 30.8 across two.</text>
<text x="530" y="196" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">Pipeline parallel (PP): the layers are cut</text>
<text x="530" y="213" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">into runs. Only the hand-off between runs</text>
<text x="530" y="230" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">crosses PCIe.</text>
<text x="20" y="262" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">Twelve cards, three stages (Volta 12X AmPLIfy)</text>
