<text x="32" y="190" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#0969da" text-anchor="start">NVLink inside the board</text>
<text x="32" y="208" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">+ Engram lookup</text>
<rect x="300" y="72" width="200" height="150" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.2"/>
