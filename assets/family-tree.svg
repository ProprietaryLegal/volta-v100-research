<text x="554" y="320" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1b1f24" text-anchor="start">2026-11-10 to 11-13, 8 cards</text>
<text x="554" y="336" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">most-used experts native, all on the cards</text>
<rect x="284" y="386" width="500" height="64" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
<text x="294" y="406" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1b1f24" text-anchor="start">Volta 12X AmPLIfy</text>
<text x="294" y="424" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1b1f24" text-anchor="start">2026-11-17, 12 cards, 3 stages of 4: every expert native, all on the cards</text>
