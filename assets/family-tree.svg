<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 494" width="808" height="494" role="img" aria-labelledby="t d">
<title id="t">The build family tree</title>
<desc id="d">1Cat pull request 1277, 1Cat-vLLM and v100-skinny are other people's work that every build runs on. Earlier PLI Labs builds: DeepSeek-V4-Flash with llama.cpp in July 2026, the first twelve-card port in October, and a build on the EXL3 engine on 2026-11-01. The Volta builds, each on the engine of the one before: Volta sPLIt (a port of pull request 1277 to two boards), Volta Full NVFP4, Volta Max uPLIft and Volta 12X AmPLIfy (twelve cards, using the three-stage cut of the October port).</desc>
<rect width="808" height="494" fill="#ffffff"/>
<text x="24" y="30" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1b1f24" text-anchor="start">The build family tree</text>
<text x="24" y="58" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#57606a" text-anchor="start">Other people's work that every build runs on</text>
<rect x="24" y="66" width="240" height="64" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="34" y="86" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1b1f24" text-anchor="start">1Cat #1277 (yangzhuxinyzx)</text>
<text x="34" y="104" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1b1f24" text-anchor="start">DeepSeek-V4.1 on one 4-card board</text>
<text x="34" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">the base of every build below</text>
<rect x="284" y="66" width="240" height="64" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="294" y="86" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1b1f24" text-anchor="start">1Cat-vLLM (1CatAI)</text>
<text x="294" y="104" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1b1f24" text-anchor="start">the Volta and Turing vLLM fork</text>
<text x="294" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">the engine all of them run on</text>
<rect x="544" y="66" width="240" height="64" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="554" y="86" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1b1f24" text-anchor="start">v100-skinny (dnv2003)</text>
<text x="554" y="104" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1b1f24" text-anchor="start">NVFP4 and FP8 kernels for Volta</text>
<text x="554" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">in 1Cat through #742 (Peuqui)</text>
<text x="24" y="166" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#57606a" text-anchor="start">Earlier PLI Labs builds, in order</text>
<rect x="24" y="174" width="240" height="64" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.2"/>
<text x="34" y="194" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1b1f24" text-anchor="start">V4-Flash with llama.cpp</text>
<text x="34" y="212" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1b1f24" text-anchor="start">July 2026, 8 cards</text>
<text x="34" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">a layer split across two boards</text>
<rect x="284" y="174" width="240" height="64" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.2"/>
<text x="294" y="194" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1b1f24" text-anchor="start">First 12-card port (1Cat #1031)</text>
<text x="294" y="212" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1b1f24" text-anchor="start">October 2026, 3 stages of 4</text>
<text x="294" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">the official checkpoint, no CUDA graphs</text>
<rect x="544" y="174" width="240" height="64" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.2"/>
<text x="554" y="194" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1b1f24" text-anchor="start">Build on the EXL3 engine</text>
