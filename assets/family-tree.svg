<text x="34" y="320" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1b1f24" text-anchor="start">2026-11-03 to 11-05, 8 cards</text>
<text x="34" y="336" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">compressed experts, all on the cards</text>
<rect x="284" y="282" width="240" height="64" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.2"/>
<text x="294" y="302" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1b1f24" text-anchor="start">Volta Full NVFP4</text>
<text x="294" y="320" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1b1f24" text-anchor="start">2026-11-09, 8 cards (the reference)</text>
<text x="294" y="336" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">all experts native, overflow in host RAM</text>
<rect x="544" y="282" width="240" height="64" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
