<text x="20" y="30" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1b1f24" text-anchor="start">One Tesla V100-SXM2-32GB (Volta, sm_70, 2017)</text>
<rect x="20" y="48" width="470" height="300" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.2"/>
