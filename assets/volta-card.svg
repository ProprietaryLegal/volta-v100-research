<text x="36" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">Tensor cores: FP16 only, mma.sync.m8n8k4 (about 125 TFLOPS at 1,530 MHz)</text>
<rect x="36" y="186" width="438" height="34" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.2"/>
<text x="48" y="208" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">L2 cache: 6 MB. A layer's weights do not fit; they stream from HBM2 every step</text>
<rect x="36" y="230" width="438" height="52" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
<text x="48" y="252" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">HBM2: 32 GB at 900 GB/s on the data sheet</text>
<text x="48" y="271" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">measured ceiling 879 GB/s read (v100-skinny)</text>
<text x="36" y="306" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">Decode needs about 139 operations per byte to keep the tensor cores busy.</text>
<text x="36" y="324" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">It does 1 to 47. The card waits on memory and on kernel launches, not on math.</text>
<rect x="520" y="48" width="230" height="84" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="532" y="70" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">NVLink 2.0</text>
<text x="532" y="89" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">to the 3 other cards of its board</text>
<text x="532" y="107" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">a four-card sum: 5.28 microseconds</text>
<text x="532" y="124" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">(measured)</text>
<rect x="520" y="146" width="230" height="96" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.2"/>
<text x="532" y="168" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">PCIe Gen3 x8</text>
<text x="532" y="187" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">to the host and to other boards</text>
<text x="532" y="205" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">host memory read by a card:</text>
<text x="532" y="222" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1b1f24" text-anchor="start">3.5 to 4.9 GB/s (measured)</text>
<text x="532" y="238" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#57606a" text-anchor="start">an eight-card sum: 30.8 microseconds</text>
<line x1="490" y1="90" x2="520" y2="90" stroke="#0969da" stroke-width="2"/>
<line x1="490" y1="194" x2="520" y2="194" stroke="#cf222e" stroke-width="2"/>
<rect x="520" y="256" width="230" height="92" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.2"/>
<text x="532" y="277" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b1f24" text-anchor="start">What sm_70 lacks</text>
<text x="532" y="296" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1b1f24" text-anchor="start">FP8, FP4, BF16, INT8 tensor modes</text>
<text x="532" y="313" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1b1f24" text-anchor="start">cp.async (Ampere), ldmatrix (Turing)</text>
<text x="532" y="330" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1b1f24" text-anchor="start">TMA, wgmma, clusters (Hopper)</text>
</svg>
