<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 362" width="770" height="362" role="img" aria-labelledby="t d">
<title id="t">One Tesla V100 card and what it lacks</title>
<desc id="d">A V100 has 80 SMs with FP16-only tensor cores, a 6 MB L2 cache and 32 GB of HBM2 at 900 GB/s. NVLink joins it to the three other cards of its board; PCIe Gen3 x8 joins it to the host and to other boards. It lacks FP8, FP4, BF16 and INT8 tensor modes, cp.async, ldmatrix, TMA and wgmma.</desc>
