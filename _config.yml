title: Volta V100 research
description: >-
  DeepSeek-V4.1-Flash on Tesla V100 (Volta, sm_70) cards: the architecture, the builds, every speed optimization
  that won or lost, the testing method and the source research. PLI Labs.
theme: jekyll-theme-cayman
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-readme-index
relative_links:
  enabled: true
  collections: false
titles_from_headings:
  enabled: true
  strip_title: false
